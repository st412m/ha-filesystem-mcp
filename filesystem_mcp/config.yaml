name: "Filesystem MCP Server"
description: "MCP server for reading/writing files via Model Context Protocol"
version: "2.6.0"
slug: filesystem_mcp
init: false
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 3101
panel_icon: mdi:file-lock-outline
panel_title: "Vault policies"
ports:
  3100/tcp: 3100
map:
  - media:rw
  - share:rw
options:
  log_requests: false
  token: "changeme"
  vault_path: "/media/VAULT"
schema:
  log_requests: bool
  token: str
  vault_path: str
