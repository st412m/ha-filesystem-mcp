name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # run.sh runs under bashio (bash); shellcheck comes with the runner image.
      - name: Shell
        run: shellcheck filesystem_mcp/run.sh
      - name: YAML
        run: >-
          pipx run yamllint==1.38.0 --strict
          -d "{extends: default, rules: {document-start: disable,
          line-length: {max: 120}, truthy: {check-keys: false}}}"
          repository.yaml filesystem_mcp/config.yaml .github/workflows/ci.yml
      # config.yaml version = top CHANGELOG entry; Dockerfile pin = the Everkeep
      # version that entry names.
      - name: Release consistency
        run: node tools/check-release.mjs
